[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlos"
version = "2.0.0"
description = "Machine Learning Operating System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.2.0",
    "joblib>=1.2.0",
    "PyYAML>=6.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "flask>=2.0"
]

[project.scripts]
mlos = "mlos.cli.main:main"

[project.optional-dependencies]
llm = [
    "openai>=1.0",
    "anthropic>=0.5",
    "google-generativeai>=0.3"
]
xgboost = [
    "xgboost>=1.7"
]
huggingface = [
    "transformers>=4.30"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mlos*"]
exclude = [
    "docs*",
    "examples*",
    "framework*",
    "playground*",
    "tests*"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

