datasets:
  titanic:
    version: "1.0"
    source: "DataScienceDojo"
    url: "https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"
    target: "Survived"
    task: "classification"
    expected_rows: 891
    expected_columns: 12
    required_columns:
      - "PassengerId"
      - "Pclass"
      - "Name"
      - "Sex"
      - "Age"
      - "Survived"

